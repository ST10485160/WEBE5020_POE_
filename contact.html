
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Marconi Beam Secondary School for general enquiries, academic information and assistance.">
    <meta name="keywords" content="contact Marconi Beam Secondary School, school contact, Cape Town school">
    <meta name="author" content="Marconi Beam Secondary School">
    <title>Contact Us | Marconi Beam Secondary School</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Marconi Beam Secondary School</h1>
    <p>Empowering Learners for Tomorrow</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="academics.html">Academics</a>
    <a href="admissions.html">Admissions</a>
    <a href="enquiry.html">Enquiry</a>
    <a href="contact.html">Contact</a>
</nav>

<main>
    <section>
        <h2>Contact Us</h2>
        <p>Have a question? Complete the form below and let us know how we can assist you.</p>

        <form id="contactForm" novalidate>

            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
            <small class="error" id="fullNameError"></small>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <small class="error" id="emailError"></small>

            <label for="phone">Contact Number:</label>
            <input type="tel" id="phone" name="phone" required>
            <small class="error" id="phoneError"></small>

            <label for="subject">Subject:</label>
            <select id="subject" name="subject" required>
                <option value="">Select a subject</option>
                <option value="General Enquiry">General Enquiry</option>
                <option value="Admissions">Admissions</option>
                <option value="Academic Information">Academic Information</option>
                <option value="School Activities">School Activities</option>
                <option value="Other">Other</option>
            </select>
            <small class="error" id="subjectError"></small>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <small class="error" id="messageError"></small>

            <button type="submit">Send Message</button>

            <p id="successMessage" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Marconi Beam Secondary School. All rights reserved.</p>
</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const fields = ["fullName", "email", "phone", "subject", "message"];
    let valid = true;

    fields.forEach(function(field) {
        document.getElementById(field + "Error").textContent = "";
    });

    document.getElementById("successMessage").textContent = "";

    fields.forEach(function(field) {
        const input = document.getElementById(field);

        if (input.value.trim() === "") {
            document.getElementById(field + "Error").textContent =
                "This field is required.";
            valid = false;
        }
    });

    const email = document.getElementById("email").value.trim();
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email !== "" && !emailPattern.test(email)) {
        document.getElementById("emailError").textContent =
            "Please enter a valid email address.";
        valid = false;
    }

    const phone = document.getElementById("phone").value.trim();
    const phonePattern = /^[0-9+\s()-]{7,20}$/;

    if (phone !== "" && !phonePattern.test(phone)) {
        document.getElementById("phoneError").textContent =
            "Please enter a valid contact number.";
        valid = false;
    }

    if (valid) {
        document.getElementById("successMessage").textContent =
            "Your message has passed validation. Thank you for contacting us!";
        this.reset();
    }
});
</script>

</body>
</html>
